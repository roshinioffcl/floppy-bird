<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floppy Bird</title>
<style>
:root{--bg:#f4f1ea;--fg:#222;--muted:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d22;--fg:#eee;--muted:#9aa}}
:root[data-theme="dark"]{--bg:#1b1d22;--fg:#eee;--muted:#9aa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
h1{margin:0;font-size:1.3rem}
canvas{max-width:100%;max-height:78vh;aspect-ratio:2/3;border-radius:12px;touch-action:manipulation;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.25)}
p{margin:0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<h1>Floppy Bird</h1>
<canvas id="c" width="360" height="540"></canvas>
<p>Tap, click, or press Space to flap</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=540,GROUND=70,GAP=145,PW=58,SPACING=200,SPEED=2.4;
const GRAV=0.42,FLAP=-7.2;
let state='ready',bird,pipes,score,best=0,groundX=0,last=0;
try{best=+localStorage.getItem('floppy-best')||0}catch(e){}

function reset(){
  bird={x:90,y:240,v:0,r:14};
  pipes=[];score=0;
  for(let i=0;i<3;i++)addPipe(W+60+i*SPACING);
}
function addPipe(x){pipes.push({x,top:70+Math.random()*(H-GROUND-GAP-140),passed:false})}

function flap(){
  if(state==='ready'){state='play'}
  if(state==='play'){bird.v=FLAP}
  else if(state==='over'&&performance.now()-overAt>400){reset();state='ready'}
}
let overAt=0;
function die(){
  state='over';overAt=performance.now();
  if(score>best){best=score;try{localStorage.setItem('floppy-best',best)}catch(e){}}
}

function update(k){
  groundX=(groundX-SPEED*k)%24;
  if(state==='ready'){bird.y=240+Math.sin(performance.now()/250)*8;return}
  if(state!=='play')return;
  bird.v+=GRAV*k;bird.y+=bird.v*k;
  for(const p of pipes){
    p.x-=SPEED*k;
    if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++}
    const bx=bird.r-3;
    if(bird.x+bx>p.x&&bird.x-bx<p.x+PW&&(bird.y-bx<p.top||bird.y+bx>p.top+GAP))die();
  }
  if(pipes[0].x+PW<0){pipes.shift();addPipe(pipes[pipes.length-1].x+SPACING)}
  if(bird.y+bird.r>H-GROUND){bird.y=H-GROUND-bird.r;die()}
  if(bird.y-bird.r<0){bird.y=bird.r;bird.v=0}
}

function text(t,x,y,size,color='#fff'){
  ctx.font='bold '+size+'px system-ui,sans-serif';ctx.textAlign='center';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,x,y);
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6ec6f0');g.addColorStop(1,'#c9ecfb');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // pipes
  for(const p of pipes){
    ctx.fillStyle='#4caf50';
    ctx.fillRect(p.x,0,PW,p.top);
    ctx.fillRect(p.x,p.top+GAP,PW,H-GROUND-p.top-GAP);
    ctx.fillStyle='#388e3c';
    ctx.fillRect(p.x-4,p.top-22,PW+8,22);
    ctx.fillRect(p.x-4,p.top+GAP,PW+8,22);
  }
  // ground
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle='#8bc34a';ctx.fillRect(0,H-GROUND,W,12);
  ctx.fillStyle='#c9c27a';
  for(let x=groundX;x<W;x+=24)ctx.fillRect(x,H-GROUND+12,12,6);
  // bird
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.max(-0.5,Math.min(1.2,bird.v/10)));
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,0,bird.r,0,7);ctx.fill();
  ctx.fillStyle='#f4a300';ctx.beginPath();ctx.ellipse(-4,3,7,5,0,0,7);ctx.fill();
  ctx.fillStyle='#ff7043';ctx.beginPath();ctx.moveTo(bird.r-2,-2);ctx.lineTo(bird.r+9,2);ctx.lineTo(bird.r-2,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,5,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(8,-5,2.2,0,7);ctx.fill();
  ctx.restore();
  // UI
  if(state!=='ready')text(score,W/2,70,44);
  if(state==='ready'){text('Floppy Bird',W/2,170,40);text('Tap to start',W/2,210,20)}
  if(state==='over'){
    text('Game Over',W/2,200,40);
    text('Score '+score+'  ·  Best '+best,W/2,245,22);
    text('Tap to retry',W/2,285,20);
  }
}

function loop(t){
  const k=Math.min(2,(t-last)/16.67||1);last=t;
  update(k);draw();requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
